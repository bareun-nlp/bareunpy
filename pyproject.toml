[tool.poetry]
name = "bareunpy"
version = "2.0.0"
description = "The bareun python library using connect-rpc"
authors = ["Gihyun YUN <gih2yun@baikal.ai>"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://bareun.ai/"
repository = "https://github.com/bareun-nlp/bareunpy"
keywords = [ "NLP", "Korean", "Deep Learning", "POS tagger", "bareun"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
# bareunpy 본체와, 현재 proto 에서 생성한 메시지/Connect 스텁(bareun) 패키지를 함께 배포한다.
packages = [
    { include = "bareunpy" },
    { include = "bareun" },
]
# 생성물의 타입 스텁(.pyi)과 PEP 561 마커는 .py 가 아니라서 명시적으로 포함한다.
include = [
    "bareun/*.pyi",
    "bareun/py.typed",
    "bareunpy/py.typed",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# 공식 Connect RPC 라이브러리(github.com/connectrpc/connect-python). server-streaming 지원.
# HTTP 전송 계층 pyqwest 는 connectrpc 가 의존성으로 가져온다.
# 아직 1.0 이전 베타라 minor 사이 호환이 깨질 수 있어 0.10.x 로 핀한다.
connectrpc = ">=0.10.1,<0.11"
# 생성된 *_pb2 는 protoc 35 gencode(7.35) 이므로 런타임 protobuf 7.35+(<8) 가 필요하다.
# bareun 모노레포(../bareun/protos)의 protoc 35 / protobuf 7.35 툴체인과 정렬한다.
protobuf = ">=7.35,<8"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.2.1"
pytest-cov = ">=4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# 커버리지 기본 옵션. 생성 코드(*_pb2*.py)는 손수 작성 코드가 아니므로 제외한다.
addopts = "--cov=bareunpy --cov=bareun --cov-report=term-missing --cov-config=pyproject.toml"

[tool.coverage.run]
branch = true
source = ["bareunpy", "bareun"]
# protoc/buf 생성 코드는 커버리지 측정 대상에서 제외한다.
# *_pb2.py, *_connect.py 는 모두 buf generate 산출물이지 손수 작성 코드가 아니다.
omit = [
    "bareun/*_pb2.py",
    "bareun/*_pb2_grpc.py",
    "bareun/*_connect.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
